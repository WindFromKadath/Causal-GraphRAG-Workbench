[project]
name = "llm-graphrag-kg"
version = "0.1.0"
description = "A modular, migration-ready Python framework for LLM + GraphRAG + Knowledge Graph with visual verification and privacy safeguards."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "WindFromKadath" }
]
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.3",
    "numpy>=2.0",
    "openai>=1.40.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyvis>=0.3.2",
    "pyyaml>=6.0.2",
    "rich>=13.7.0",
    "typer>=0.12.5",
]

[project.optional-dependencies]
viz = [
    "pandas>=2.2.0",
    "streamlit>=1.38.0",
]
enterprise = [
    "fastapi>=0.115.0",
    "huggingface-hub>=0.25.0",
    "langgraph>=0.4.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "neo4j>=5.25.0",
    "onnxruntime>=1.20.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pymupdf>=1.25.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.12",
    "redis>=5.2.0",
    "tokenizers>=0.20.0",
    "uvicorn[standard]>=0.32.0",
]
docling = [
    "docling>=2.15.0",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[project.scripts]
llm-graphrag-kg = "llm_graphrag_kg.cli:app"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Query",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
