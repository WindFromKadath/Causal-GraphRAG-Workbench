# GraphRAG-Bench (ICLR) Multi-Hop & Complex Reasoning Benchmark Configuration
# Source corpus & questions live strictly in gitignored `data/private/graphrag_bench/`

paths:
  input_dir: data/private/graphrag_bench_docs
  storage_dir: storage/graphrag_bench
  output_dir: outputs/graphrag_bench

chunking:
  chunk_size: 900
  chunk_overlap: 150

extraction:
  entity_types:
    - Disease
    - RiskFactor
    - Symptom
    - DiagnosticTest
    - Treatment
    - Anatomy
    - Biomarker
    - Guideline
  temperature: 0.1
  max_entities_per_chunk: 12

community:
  resolution: 1.0
  seed: 42
  summarize_with_llm: false

retrieval:
  default_mode: ppr
  top_k_chunks: 5
  top_k_entities: 6
  k_hops: 2
  top_k_communities: 3
  temperature: 0.1
  # Stage 3.1: BM25 + Dense RRF & HippoRAG 2
  enable_hybrid_bm25: true
  hybrid_bm25_weight: 0.35
  rrf_k: 60
  enable_query_to_triple: true
  top_k_triples: 8
  enable_synonym_edges: true
  synonym_cosine_threshold: 0.85

harness:
  enable_compact: true
  max_context_tokens: 3500
  max_entities: 24
  max_subgraph_relations: 32
  max_evidence_chunks: 6
  json_repair_retries: 1
  max_calls: 8
  max_wall_seconds: 120.0

reasoning:
  default_paradigm: tot
  tot_beam_width: 3
  tot_max_depth: 2
  tot_max_llm_calls: 6
